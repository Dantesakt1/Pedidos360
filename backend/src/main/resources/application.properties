spring.application.name=backend
server.port=8080

# Conexión a la Base de Datos en AWS RDS (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:pedidosdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Configuración de identidad con Entra ID (Exigiendo tokens v2.0)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_API_CLIENT_ID}

# --- Configuración RabbitMQ Clúster ---
spring.rabbitmq.addresses=localhost:5672,localhost:5673
spring.rabbitmq.username=labuser
spring.rabbitmq.password=labpass

# --- Configuración de Confiabilidad (ACK Manual y DLQ) ---
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false