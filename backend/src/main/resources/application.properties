spring.application.name=backend
server.port=8080

# --- Base de Datos AWS RDS (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:pedidosdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Seguridad JWT Microsoft Entra ID ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_API_CLIENT_ID}

# --- RabbitMQ Clúster ---
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBIT_USER:labuser}
spring.rabbitmq.password=${RABBIT_PASS:labpass}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ==========================================
# APACHE KAFKA - CLUSTER & SERIALIZACION
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094

# Configuracion del Productor (JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Configuracion del Consumidor (JSON + manejo de errores)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Listener ack mode
spring.kafka.listener.ack-mode=record