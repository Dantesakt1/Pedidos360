<div class="container" style="padding: 20px; font-family: Arial, sans-serif;">
  <h1>Pedidos360</h1>

  <!-- Vista para usuario NO logueado -->
  <div *ngIf="!user">
    <p>Por favor, inicia sesión con tu cuenta institucional para acceder al sistema.</p>
    <button (click)="login()"
      style="padding: 10px; background-color: #0078D4; color: white; border: none; cursor: pointer;">
      Iniciar Sesión con Entra ID
    </button>
  </div>

  <!-- Vista para usuario SÍ logueado -->
  <div *ngIf="user">
    <div
      style="display: flex; justify-content: space-between; align-items: center; background-color: #f4f4f4; padding: 10px;">
      <span>Bienvenido, <strong>{{ user.name }}</strong> ({{ user.username }})</span>
      <button (click)="logout()"
        style="padding: 5px 10px; background-color: #d9534f; color: white; border: none; cursor: pointer;">
        Cerrar Sesión
      </button>
    </div>

    <hr>

    <!-- Menú de navegación mínimo -->
    <nav style="margin-bottom: 20px;">
      <button routerLink="/catalog" style="margin-right: 10px;">Ver Catálogo</button>
      <button routerLink="/orders" style="margin-right: 10px;">Gestión de Pedidos</button>
      <button routerLink="/protegido">Prueba MsalGuard</button>
    </nav>

    <!-- Aquí se inyectarán dinámicamente los componentes según la ruta -->
    <div style="border: 1px solid #ccc; padding: 20px;">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
