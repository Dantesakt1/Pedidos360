<div class="container-fluid py-4">
  <!-- Cabecera -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-dark mb-0">Catálogo de Productos</h2>
    <!-- Solo visible para Admin / Operador -->
    <button *ngIf="esAdminOp" class="btn btn-success px-4 rounded-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#modalProducto">
      + Crear producto
    </button>
  </div>

  <!-- Tabla de Productos -->
  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light text-secondary text-uppercase fs-7">
          <tr>
            <th class="py-3 px-4">ID</th>
            <th class="py-3">Nombre del Producto</th>
            <th class="py-3">Precio Unitario</th>
            <th class="py-3 px-4">Nivel de Stock</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let producto of productos">
            <td class="px-4 fw-semibold text-dark">#{{ producto.id }}</td>
            <td>{{ producto.nombre }}</td>
            <td class="text-primary fw-bold">${{ producto.precio }}</td>
            <td class="px-4">
              <!-- Si es Admin/Op ve los botones de modificar stock. Si es Cliente, solo ve el stock en texto plano -->
              <div class="d-flex align-items-center gap-2" *ngIf="esAdminOp; else clienteStock">
                <button class="btn btn-sm btn-outline-secondary py-0 px-2" (click)="cambiarStock(producto, -1)">-</button>
                <span class="badge" [ngClass]="producto.stock > 10 ? 'bg-success' : 'bg-danger'">
                  {{ producto.stock }} unidades
                </span>
                <button class="btn btn-sm btn-outline-secondary py-0 px-2" (click)="cambiarStock(producto, 1)">+</button>
              </div>
              <ng-template #clienteStock>
                <span class="badge" [ngClass]="producto.stock > 10 ? 'bg-success' : 'bg-danger'">
                  {{ producto.stock }} unidades (Disponible)
                </span>
              </ng-template>
            </td>
          </tr>
          <tr *ngIf="productos.length === 0">
            <td colspan="4" class="text-center py-5 text-muted">No hay productos en el catálogo.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal para Crear Producto (Solo se abre si es Admin) -->
<div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true" *ngIf="esAdminOp">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4 shadow">
      <div class="modal-header border-0 pb-0 px-4 pt-4">
        <h5 class="fw-bold text-dark mb-0">Nuevo Producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="cerrarModalBtn"></button>
      </div>
      <div class="modal-body p-4">
        <form (submit)="guardarProducto(); $event.preventDefault()">
          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">Nombre</label>
            <input type="text" class="form-control rounded-3" [(ngModel)]="nuevoProducto.nombre" name="nombre" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">Precio</label>
            <input type="number" class="form-control rounded-3" [(ngModel)]="nuevoProducto.precio" name="precio" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">Stock Inicial</label>
            <input type="number" class="form-control rounded-3" [(ngModel)]="nuevoProducto.stock" name="stock" required>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-light px-4 rounded-3" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-success px-4 rounded-3 fw-medium">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
